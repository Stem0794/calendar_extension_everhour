<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly Calendar Project Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-page">
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">W</div>
          <div>
            <h1>Weekly Calendar</h1>
            <p>Project Tracker</p>
          </div>
        </div>
        <button
          id="open-options"
          class="icon-btn header-action"
          type="button"
          title="Open settings"
        >
          <span aria-hidden="true">⚙</span>
          <span class="sr-only">Open settings</span>
        </button>
      </header>

      <div id="onboarding-tip" class="onboarding-tip" style="display: none">
        <div class="onboarding-icon" aria-hidden="true">↗</div>
        <div>
          <strong>Start in Google Calendar</strong>
          <span>Open Week view, then come back here to review your meetings.</span>
        </div>
        <button type="button" class="banner-close" aria-label="Dismiss welcome message">×</button>
      </div>

      <nav id="tabs" class="app-tabs" role="tablist" aria-label="Time views">
        <button
          class="tab active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="summary"
          data-tab="summary"
        >
          Meetings
        </button>
        <button
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="hours"
          data-tab="hours"
        >
          Project Hours
        </button>
      </nav>

      <section id="summary" class="tab-content active" role="tabpanel">
        <div class="view-heading">
          <div>
            <p class="eyebrow">This calendar view</p>
            <h2>Meeting log</h2>
          </div>
          <label class="compact-field" for="summary-filter">
            <span>Period</span>
            <select id="summary-filter">
              <option value="week">Full week</option>
              <option value="monday">Monday</option>
              <option value="tuesday">Tuesday</option>
              <option value="wednesday">Wednesday</option>
              <option value="thursday">Thursday</option>
              <option value="friday">Friday</option>
            </select>
          </label>
        </div>

        <div class="metric-grid" aria-label="Meeting overview">
          <div class="metric-card">
            <span id="summary-meeting-count" class="metric-value">—</span>
            <span class="metric-label">Meetings</span>
          </div>
          <div class="metric-card">
            <span id="summary-hours-total" class="metric-value">—</span>
            <span class="metric-label">Hours</span>
          </div>
          <div class="metric-card">
            <span id="summary-assigned-count" class="metric-value">—</span>
            <span class="metric-label">Assigned</span>
          </div>
        </div>

        <div class="list-toolbar">
          <label class="filter-checkbox">
            <input type="checkbox" id="unassigned-filter" />
            <span>Show unassigned only</span>
          </label>
          <button id="refresh-btn" class="text-btn" type="button" title="Refresh calendar events">
            <span aria-hidden="true">↻</span> Refresh
          </button>
        </div>

        <div id="log-all-status" style="display: none" aria-live="polite"></div>
        <div id="sync-check-status" style="display: none" aria-live="polite"></div>
        <div id="offline-queue-status" style="display: none" aria-live="polite"></div>
        <div id="meeting-list" class="data-region"></div>

        <div class="sticky-actions">
          <button id="log-all-btn" class="primary-action" type="button">
            <span aria-hidden="true">✓</span> Log assigned
          </button>
          <button id="retry-missed-btn" type="button" style="display: none">Log missed</button>
          <button
            id="undo-log-all-btn"
            class="secondary-action"
            type="button"
            style="display: none"
          >
            Undo
          </button>
          <button id="sync-check-btn" class="secondary-action" type="button">Check sync</button>
        </div>
      </section>

      <section id="hours" class="tab-content" role="tabpanel">
        <div class="view-heading">
          <div>
            <p class="eyebrow">Allocation</p>
            <h2>Project hours</h2>
          </div>
          <label class="compact-field" for="hours-filter">
            <span>Period</span>
            <select id="hours-filter">
              <option value="week">Full week</option>
              <option value="monday">Monday</option>
              <option value="tuesday">Tuesday</option>
              <option value="wednesday">Wednesday</option>
              <option value="thursday">Thursday</option>
              <option value="friday">Friday</option>
            </select>
          </label>
        </div>
        <p class="section-intro">Only meetings assigned to a project are included.</p>
        <div id="project-hours-table" class="data-region"></div>
      </section>
    </main>

    <script src="util.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
